name: Poller de partidas

# Busca partidas novas na HenrikDev e grava no Supabase. Também promove algumas
# partidas de resumo a completas por execução (deep backfill em rodízio).
#
# Gatilhos:
#  - schedule: fallback. O GitHub atrasa crons de repo free (na prática rodava a
#    cada poucas horas) e DESATIVA o cron após 60 dias sem commit.
#  - workflow_dispatch: o gatilho real, chamado a cada 15 min pelo pg_cron do
#    Supabase (ver docs/DEPLOY_WEB.md). Não depende do humor do scheduler.
#  - keepalive: todo run reativa o próprio workflow via API, o que zera o
#    contador de 60 dias de inatividade.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # keepalive (gh workflow enable)

concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Rodar ingestão
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
          DEFAULT_REGION: ${{ vars.DEFAULT_REGION || 'na' }}
          DEEP_PER_RUN: ${{ vars.DEEP_PER_RUN || '10' }}
        run: python -m app.poll

      - name: Keepalive do cron
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable poll.yml --repo "${{ github.repository }}" || true
