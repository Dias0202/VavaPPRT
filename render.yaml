# Blueprint do Render — sobe a API (o banco fica no Supabase).
#
# Uso: render.com → New + → Blueprint → conecte este repositório. O Render
# pergunta os segredos marcados com `sync: false`.
#
# Por que o banco NÃO fica no Render: o Postgres free do Render expira em 30
# dias (foi o que derrubou a produção em set/2026). O Supabase free não expira.
# DATABASE_URL = URI do *session pooler* do Supabase (IPv4), com sslmode=require.

services:
  - type: web
    name: vavapprt-api
    runtime: python
    plan: free
    region: oregon # mesma região do Supabase (us-west-2): latência ~1 ms
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL # URI do session pooler do Supabase
        sync: false
      - key: HENRIKDEV_API_KEY # Basic Key da HenrikDev
        sync: false
      - key: ADMIN_RIOT_ID # Nome#TAG de quem administra o grupo
        sync: false
      - key: JWT_SECRET # gerado pelo Render, ninguém precisa inventar
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dias0202.github.io
      - key: DEFAULT_REGION
        value: na
      - key: BOT_API_TOKEN # espelho /bot/v1 do bot X9 (vazio = rota desligada)
        sync: false
